name: Build and safety checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Swift checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Standalone safety and naming regression checks
        run: bash scripts/test-naming-safety.sh
      - name: Isolated folder event regression checks
        run: bash scripts/test-folder-assist-monitor.sh
      - name: Build Naming Assistant
        run: swift build --build-system native --product NamingAssistant
