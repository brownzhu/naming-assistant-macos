<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Naming Assistant local workflow</title><desc id="desc">Six steps: select explicit files, local suggestion, preview and safety checks, user confirmation, rename with private journal, then verification or safe undo. No recursion or automatic rename.</desc>
<rect x="0" y="0" width="1280" height="800" rx="0" fill="#f4f7fb" stroke="none"/>
<text x="58" y="70" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#14253d" font-weight="700" >You stay in control.</text><text x="58" y="108" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#52657d" font-weight="400" >A local suggestion becomes a rename only after preview and confirmation.</text><rect x="1044" y="39" width="178" height="32" rx="16" fill="#e3ebf5" stroke="none"/><text x="1064" y="61" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#405772" font-weight="700" >ILLUSTRATION</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7489a2"/></marker></defs><rect x="48" y="157" width="368" height="184" rx="16" fill="#fff" stroke="#d8e1ec"/><rect x="70" y="179" width="34" height="34" rx="11" fill="#1467c2" stroke="none"/><text x="87" y="203" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="70" y="251" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#14253d" font-weight="650" >Select files</text><text x="70" y="286" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52657d" font-weight="400" >Choose explicit items in Finder.</text><text x="70" y="314" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52657d" font-weight="400" >No recursive folder scan.</text><rect x="456" y="157" width="368" height="184" rx="16" fill="#fff" stroke="#d8e1ec"/><rect x="478" y="179" width="34" height="34" rx="11" fill="#6d43b1" stroke="none"/><text x="495" y="203" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="478" y="251" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#14253d" font-weight="650" >Local suggestion</text><text x="478" y="286" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52657d" font-weight="400" >English description suggestions.</text><text x="478" y="314" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52657d" font-weight="400" >No file content upload.</text><rect x="864" y="157" width="368" height="184" rx="16" fill="#fff" stroke="#d8e1ec"/><rect x="886" y="179" width="34" height="34" rx="11" fill="#137d66" stroke="none"/><text x="903" y="203" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="886" y="251" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#14253d" font-weight="650" >Preview &amp; checks</text><text x="886" y="286" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52657d" font-weight="400" >Review the full proposed names.</text><text x="886" y="314" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52657d" font-weight="400" >Protected items are skipped.</text><rect x="48" y="399" width="368" height="184" rx="16" fill="#fff" stroke="#d8e1ec"/><rect x="70" y="421" width="34" height="34" rx="11" fill="#a35b00" stroke="none"/><text x="87" y="445" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="70" y="493" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#14253d" font-weight="650" >Confirm</text><text x="70" y="528" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52657d" font-weight="400" >Choose the items to rename.</text><text x="70" y="556" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52657d" font-weight="400" >Nothing changes automatically.</text><rect x="456" y="399" width="368" height="184" rx="16" fill="#fff" stroke="#d8e1ec"/><rect x="478" y="421" width="34" height="34" rx="11" fill="#1467c2" stroke="none"/><text x="495" y="445" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="478" y="493" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#14253d" font-weight="650" >Rename + journal</text><text x="478" y="528" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52657d" font-weight="400" >Never overwrite an existing item.</text><text x="478" y="556" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52657d" font-weight="400" >Write a private local journal.</text><rect x="864" y="399" width="368" height="184" rx="16" fill="#fff" stroke="#d8e1ec"/><rect x="886" y="421" width="34" height="34" rx="11" fill="#137d66" stroke="none"/><text x="903" y="445" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="886" y="493" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#14253d" font-weight="650" >Verify / safe undo</text><text x="886" y="528" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52657d" font-weight="400" >Check identity and content first.</text><text x="886" y="556" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52657d" font-weight="400" >Stop when a safe undo is blocked.</text><path d="M423 249 H442" stroke="#7489a2" stroke-width="3" fill="none"/><path d="M439 243 L449 249 L439 255 Z" fill="#7489a2"/><path d="M831 249 H850" stroke="#7489a2" stroke-width="3" fill="none"/><path d="M847 243 L857 249 L847 255 Z" fill="#7489a2"/><path d="M423 491 H442" stroke="#7489a2" stroke-width="3" fill="none"/><path d="M439 485 L449 491 L439 497 Z" fill="#7489a2"/><path d="M831 491 H850" stroke="#7489a2" stroke-width="3" fill="none"/><path d="M847 485 L857 491 L847 497 Z" fill="#7489a2"/><path d="M1048 349 V367 H232 V384" stroke="#7489a2" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M226 382 L232 392 L238 382 Z" fill="#7489a2"/><rect x="48" y="620" width="1184" height="100" rx="16" fill="#14253d" stroke="none"/><text x="76" y="657" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#fff" font-weight="650" >Conservative by default</text><text x="76" y="692" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#dce7f6" font-weight="400" >Fixed names and recognized engineering files are protected. Nonempty folders receive suggestions only.</text><text x="58" y="766" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52657d" font-weight="400" >Conceptual workflow illustration. All renames and undo operations require an explicit user action.</text>
</svg>