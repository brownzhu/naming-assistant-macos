<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="844" viewBox="0 0 1280 844" role="img" aria-labelledby="title desc">
<title id="title">Naming Assistant naming format</title><desc id="desc">Illustration of date, English category, snake_case description, version and preserved extension. Project folders use month precision. Unverified dates use undated.</desc>
<rect x="0" y="0" width="1280" height="844" rx="0" fill="#f4f7fb" stroke="none"/>
<text x="58" y="70" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#14253d" font-weight="700" >A clear name, every time.</text><text x="58" y="108" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#52657d" font-weight="400" >One underscore-based style for files and project folders.</text><rect x="1044" y="39" width="178" height="32" rx="16" fill="#e3ebf5" stroke="none"/><text x="1064" y="61" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#405772" font-weight="700" >ILLUSTRATION</text><rect x="48" y="145" width="1184" height="256" rx="16" fill="#fff" stroke="#d8e1ec"/><text x="76" y="183" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52657d" font-weight="700" >FILE</text><text x="76" y="244" font-family="Menlo, Consolas, monospace" font-size="26" fill="#1467c2" font-weight="600"  textLength="172.172" lengthAdjust="spacingAndGlyphs">2026_10_21_</text><path d="M76 268 H242.15" stroke="#1467c2" stroke-width="4" stroke-linecap="round"/><text x="76" y="310" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1467c2" font-weight="650" >Date</text><text x="76" y="339" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52657d" font-weight="400" >YYYY_MM_DD</text><text x="248.15" y="244" font-family="Menlo, Consolas, monospace" font-size="26" fill="#6d43b1" font-weight="600"  textLength="140.868" lengthAdjust="spacingAndGlyphs">research_</text><path d="M248.15 268 H383.0" stroke="#6d43b1" stroke-width="4" stroke-linecap="round"/><text x="296" y="310" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6d43b1" font-weight="650" >Category</text><text x="296" y="339" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52657d" font-weight="400" >English label</text><text x="389.0" y="244" font-family="Menlo, Consolas, monospace" font-size="26" fill="#137d66" font-weight="600"  textLength="219.128" lengthAdjust="spacingAndGlyphs">meeting_notes_</text><path d="M389.0 268 H602.1" stroke="#137d66" stroke-width="4" stroke-linecap="round"/><text x="516" y="310" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#137d66" font-weight="650" >Description</text><text x="516" y="339" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52657d" font-weight="400" >english_snake_case</text><text x="608.1" y="244" font-family="Menlo, Consolas, monospace" font-size="26" fill="#a35b00" font-weight="600"  textLength="46.955999999999996" lengthAdjust="spacingAndGlyphs">v01</text><path d="M608.1 268 H649.0500000000001" stroke="#a35b00" stroke-width="4" stroke-linecap="round"/><text x="736" y="310" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#a35b00" font-weight="650" >Version</text><text x="736" y="339" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52657d" font-weight="400" >v01, v02, ...</text><text x="655.0500000000001" y="244" font-family="Menlo, Consolas, monospace" font-size="26" fill="#52657d" font-weight="600"  textLength="62.608" lengthAdjust="spacingAndGlyphs">.txt</text><path d="M655.0500000000001 268 H711.6500000000001" stroke="#52657d" stroke-width="4" stroke-linecap="round"/><text x="956" y="310" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#52657d" font-weight="650" >Extension</text><text x="956" y="339" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52657d" font-weight="400" >Kept intact</text><text x="76" y="377" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52657d" font-weight="400" >The final suffix, including recognized compound extensions such as .tar.gz, is preserved.</text><rect x="48" y="423" width="1184" height="158" rx="16" fill="#fff" stroke="#d8e1ec"/><text x="76" y="461" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52657d" font-weight="700" >PROJECT FOLDER</text><text x="76" y="515" font-family="Menlo, Consolas, monospace" font-size="27" fill="#1467c2" font-weight="600"  textLength="130.03199999999998" lengthAdjust="spacingAndGlyphs">2026_10_</text><text x="206.0" y="515" font-family="Menlo, Consolas, monospace" font-size="27" fill="#6d43b1" font-weight="600"  textLength="146.286" lengthAdjust="spacingAndGlyphs">research_</text><text x="352.25" y="515" font-family="Menlo, Consolas, monospace" font-size="27" fill="#137d66" font-weight="600"  textLength="243.81" lengthAdjust="spacingAndGlyphs">cem_eit_project</text><text x="76" y="552" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#52657d" font-weight="400" >Month precision: YYYY_MM_category_project_name</text><rect x="48" y="603" width="1184" height="122" rx="16" fill="#14253d" stroke="none"/><text x="76" y="641" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fff" font-weight="650" >Verified date only</text><text x="76" y="676" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#dce7f6" font-weight="400" >Use undated when the date is unconfirmed; the app does not infer it from file metadata.</text><text x="58" y="765" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#52657d" font-weight="650" >Categories</text><rect x="180" y="743" width="70" height="32" rx="16" fill="#e9e2f7" stroke="none"/><text x="195" y="765" font-family="Menlo, Consolas, monospace" font-size="16" fill="#623a9f" font-weight="400"  textLength="38.528" lengthAdjust="spacingAndGlyphs">life</text><rect x="262" y="743" width="110" height="32" rx="16" fill="#e9e2f7" stroke="none"/><text x="277" y="765" font-family="Menlo, Consolas, monospace" font-size="16" fill="#623a9f" font-weight="400"  textLength="77.056" lengthAdjust="spacingAndGlyphs">research</text><rect x="384" y="743" width="140" height="32" rx="16" fill="#e9e2f7" stroke="none"/><text x="399" y="765" font-family="Menlo, Consolas, monospace" font-size="16" fill="#623a9f" font-weight="400"  textLength="105.952" lengthAdjust="spacingAndGlyphs">engineering</text><rect x="536" y="743" width="110" height="32" rx="16" fill="#e9e2f7" stroke="none"/><text x="551" y="765" font-family="Menlo, Consolas, monospace" font-size="16" fill="#623a9f" font-weight="400"  textLength="77.056" lengthAdjust="spacingAndGlyphs">learning</text><rect x="658" y="743" width="80" height="32" rx="16" fill="#e9e2f7" stroke="none"/><text x="673" y="765" font-family="Menlo, Consolas, monospace" font-size="16" fill="#623a9f" font-weight="400"  textLength="48.16" lengthAdjust="spacingAndGlyphs">admin</text><text x="58" y="813" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52657d" font-weight="400" >Examples describe the naming convention; they are not screenshots of the application.</text>
</svg>